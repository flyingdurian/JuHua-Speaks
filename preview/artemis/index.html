<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>JuHua — Artemis Reader / Standalone Visual Review</title>
<link rel="stylesheet" href="./artemis.css"/>
<style>
:root{color-scheme:dark;background:#070612;font-family:Arial,sans-serif;color:#eaddca}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
#artemis-preview-root{position:fixed;inset:0;overflow:hidden}
#artemis-review-toolbar{position:fixed;right:14px;top:58px;z-index:160;display:flex;align-items:center;gap:9px;
background:#18182be8;border:1px solid #c5a36b;padding:7px 10px;border-radius:7px;font:11px Arial,sans-serif}
#artemis-review-toolbar select,#artemis-review-toolbar button{color:#f4e7d5;background:#282138;border:1px solid #997c5c;padding:6px}
@media(max-width:650px){#artemis-review-toolbar{top:auto;bottom:9px;left:9px;right:9px;justify-content:center}}
</style>
</head>
<body>
<main id="artemis-preview-root" aria-label="Artemis standalone visual review"></main>
<div id="artemis-review-toolbar">
 <label for="portrait-review">Preview expression</label>
 <select id="portrait-review" aria-label="Artemis expression"></select>
 <button type="button" id="reset-artemis">Restart</button>
</div>
<script type="module" src="./demo.mjs"></script>
</body></html>
