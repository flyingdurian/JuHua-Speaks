name: Visual Layout Tuner — debug branch (no deploy)
on:
  push:
    branches: [debug/visual-layout-tuner]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-layout-tuner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and unit checks
        run: |
          mkdir -p .artifacts/logs
          if {
            node --check preview/post-shuffle/debug/visual-layout-tuner.mjs
            node --check preview/post-shuffle/debug/layout-preview.mjs
            node --check preview/post-shuffle/debug/layout-inspector.mjs
            node --check preview/post-shuffle/debug/layout-assets.mjs
            node scripts/test-visual-layout-tuner.mjs
            npm test
          } > .artifacts/logs/visual-layout-source.log 2>&1; then
            echo "PASS source / unit checks"
          else
            echo "::error::Source checks failed — see .artifacts/logs/visual-layout-source.log"
            tail -n 12 .artifacts/logs/visual-layout-source.log
            exit 1
          fi
      - name: Install browser
        run: |
          npm install --no-save playwright > .artifacts/logs/playwright-install.log 2>&1
          npx playwright install chromium --only-shell >> .artifacts/logs/playwright-install.log 2>&1
      - name: Sync RWS assets
        run: npm run assets:sync > .artifacts/logs/assets-sync.log 2>&1
      - name: Start real Gate B preview
        run: |
          npm run preview:gate-b > .artifacts/logs/preview-gate-b.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4184/preview/post-shuffle/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::Preview failed to start"; exit 1
      - name: Browser interaction and geometry checks
        run: |
          if node scripts/smoke-visual-layout-tuner.mjs > .artifacts/logs/visual-layout-browser.log 2>&1; then
            echo "PASS visual tuner browser interactions"
          else
            echo "::error::Visual tuner browser test failed; see .artifacts/logs/visual-layout-browser.log"
            tail -n 20 .artifacts/logs/visual-layout-browser.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-layout-tuner-review
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
