name: Artemis PR28 — exact source snapshot for art QA
on:
  push:
    branches: [feat/artemis-ai-synthesis-remake]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle-checked-in-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Archive exactly tracked branch files, without modifying source
        run: git ls-files -z | tar --null -T - -czf artemis-pr28-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: artemis-pr28-exact-source
          path: artemis-pr28-source.tgz
          if-no-files-found: error
          retention-days: 7
