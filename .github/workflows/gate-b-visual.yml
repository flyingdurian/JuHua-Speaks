name: Gate B v7 GPU video evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ritual-world/**'
      - 'preview/gate-b/**'
      - 'scripts/capture-gate-b-v7.mjs'
      - '.github/workflows/gate-b-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run assets:sync
      - name: Run dedicated preview and record WebGL2 frames
        run: |
          npm run preview:gate-b > /tmp/gate-b-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4184/preview/gate-b/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/capture-gate-b-v7.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-b-v7-gpu-recording
          path: |
            artifacts/gate-b-v7
            /tmp/gate-b-preview.log
          retention-days: 14
