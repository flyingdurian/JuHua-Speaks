name: Verify and deploy JuHua Speaks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: |
          node --check src/ritual-world/OrbitalField.mjs
          node --check src/ritual-world/RitualWorld.mjs
          node --check src/ritual-world/CardSurface.mjs
          node --check src/ritual-world/CelestialSky.mjs
          node --check preview/gate-a/gate-a.mjs
          node --check src/ritual-world/CanvasOrbit.mjs
      - name: Verify production landing and historical ritual handoff
        run: node --test test/production-landing.test.mjs
      - name: Verify JavaScript source syntax
        run: |
          node --check src/app.mjs
          node --check src/webgl-sphere.mjs
          node --check src/ritual-views.mjs
          node --check src/ritual-machine.mjs
          node --check src/deck-config.mjs
          node --check src/ritual-cinema.mjs
          node --check src/physical-reveal.mjs
      - name: Validate source asset rules
        run: |
          if find assets/rws -name '*.jpg' | grep -q .; then
            echo 'JPEG scans should be downloaded and validated by the artifact pipeline, not committed blindly.'
            exit 1
          fi
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch licensed original scans
        run: npm run assets:sync
      - name: Verify 78 scans
        run: npm run assets:audit
      - name: Assemble self-contained site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp ritual.html _site/ritual.html
          cp -R preview _site/preview
          cp -R src _site/src
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - name: Clear a stuck Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const busy = new Set(['queued', 'deployment_queued', 'syncing_files', 'in_progress', 'building']);
            let deployments = [];
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/pages/deployments', {owner, repo, per_page: 20});
              deployments = response.data;
            } catch (error) {
              core.warning(`Could not list Pages deployments: ${error.message}`);
            }
            for (const deployment of deployments) {
              if (!busy.has(deployment.status)) continue;
              core.warning(`Cancelling Pages deployment ${deployment.id} (${deployment.status})`);
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {owner, repo, pages_deployment_id: deployment.id});
              } catch (error) {
                core.warning(`Could not cancel ${deployment.id}: ${error.message}`);
              }
            }
            if (deployments.some(deployment => busy.has(deployment.status))) {
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
