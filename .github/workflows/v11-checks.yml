name: V11 Gate B/C review checks (no deployment)
on:
  push:
    branches:
      - feat/gate-b-gate-c-retime-anti-solid-v11
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v11-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all modified ESM syntax
        run: |
          node --check src/app.mjs
          node --check src/physical-reveal.mjs
          node --check src/webgl-sphere.mjs
          node --check src/ritual-world/ReferenceRitual.mjs
          node --check src/ritual-world/RitualWorld.mjs
          node --check src/ritual-world/ShuffleChoreography.mjs
          node --check preview/gate-b/gate-b.mjs
      - name: All source regression tests
        run: npm test
