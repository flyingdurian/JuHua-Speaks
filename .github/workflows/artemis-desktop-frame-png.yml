name: Artemis Desktop Frame PNG — branch asset conversion
on:
  push:
    branches: [feat/artemis-ai-synthesis-remake]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artemis-desktop-frame-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ensure-desktop-png:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate desktop PNG from checked-in original WEBP
        run: |
          if [ -f assets/artemis/ui_reading_frame_panel.png ]; then
            echo "Desktop PNG already committed."
          else
            python3 -m pip install -q pillow
            python3 scripts/convert-artemis-desktop-frame.py
          fi
      - name: Commit generated artwork to PR #28 branch
        run: |
          if [ -f assets/artemis/ui_reading_frame_panel.png ] && ! git ls-files --error-unmatch assets/artemis/ui_reading_frame_panel.png >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/artemis/ui_reading_frame_panel.png
            git commit -m 'assets(artemis): install original desktop reading-frame PNG'
            git push origin HEAD:feat/artemis-ai-synthesis-remake
          fi
